input {
  beats {
    port => 5044
  }
}

filter {
  if [log][file][path] =~ "auth.log" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:sys_timestamp} %{SYSLOGHOST:host} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:msg}"
      }
    }

    if [msg] =~ "Failed password" {
      mutate { add_tag => ["auth_failure"] }
      grok {
        match => {
          "msg" => "Failed password for (invalid user )?%{DATA:username} from %{IP:src_ip} port %{NUMBER:src_port}"
        }
      }
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }

    if [msg] =~ "Accepted password" {
      mutate { add_tag => ["auth_success"] }
      grok {
        match => {
          "msg" => "Accepted password for %{DATA:username} from %{IP:src_ip} port %{NUMBER:src_port}"
        }
      }
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-auth-%{+YYYY.MM.dd}"
  }
  # Uncomment to debug in the terminal:
  # stdout { codec => rubydebug }
}
